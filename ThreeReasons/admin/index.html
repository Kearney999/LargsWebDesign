<!DOCTYPE html><html lang="en" data-astro-cid-ltj5pzzq><head><meta charset="UTF-8"><title>The Three Reasons - Menu Admin</title><style>body{color:#5c2444;background:#fdfbf7;max-width:600px;margin:40px auto;padding:20px;font-family:system-ui,-apple-system,sans-serif}.card[data-astro-cid-ltj5pzzq]{background:#fff;border:1.5px solid #5c2444;border-radius:12px;padding:24px;box-shadow:0 4px 12px #0000000d}h1[data-astro-cid-ltj5pzzq]{margin-top:0;font-size:1.4rem}label[data-astro-cid-ltj5pzzq]{margin-top:14px;margin-bottom:6px;font-weight:700;display:block}textarea[data-astro-cid-ltj5pzzq],input[data-astro-cid-ltj5pzzq][type=text]{box-sizing:border-box;border:1px solid #5c24444d;border-radius:6px;width:100%;padding:10px}.note-row[data-astro-cid-ltj5pzzq]{gap:8px;margin-bottom:10px;display:flex}button[data-astro-cid-ltj5pzzq]{color:#fff;cursor:pointer;background:#5c2444;border:none;border-radius:8px;width:100%;margin-top:20px;padding:12px 18px;font-weight:700}button[data-astro-cid-ltj5pzzq]:hover{opacity:.9}.status[data-astro-cid-ltj5pzzq]{text-align:center;margin-top:12px;font-weight:700}
</style></head><body data-astro-cid-ltj5pzzq><div class="card" data-astro-cid-ltj5pzzq><h1 data-astro-cid-ltj5pzzq>The Three Reasons — Menu Editor</h1><p style="font-size: 0.85rem; color: #666;" data-astro-cid-ltj5pzzq>Update general notice banners and announcements live on the site.</p><form id="adminForm" data-astro-cid-ltj5pzzq><h3 data-astro-cid-ltj5pzzq>General Notices</h3><div id="notesContainer" data-astro-cid-ltj5pzzq></div><button type="submit" id="saveBtn" data-astro-cid-ltj5pzzq>💾 Publish Changes</button><div id="status" class="status" data-astro-cid-ltj5pzzq></div></form></div><script>
      const GITHUB_TOKEN = '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';
      const REPO_OWNER = 'Kearney999';
      const REPO_NAME = 'LargsWebDesign';
      const FILE_PATH = 'ThreeReasons/config_ThreeReasons_Hub.json';

      const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
      let currentConfig = null;
      let fileSha = '';

      // Load configuration from GitHub REST API
      async function loadCurrentConfig() {
        const statusDiv = document.getElementById('status');
        try {
          // 1. Try GitHub API first
          const res = await fetch(API_URL, {
            headers: {
              'Authorization': `Bearer ${GITHUB_TOKEN}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });

          if (res.ok) {
            const data = await res.json();
            fileSha = data.sha;
            const decodedContent = decodeURIComponent(escape(atob(data.content)));
            currentConfig = JSON.parse(decodedContent);
            if (statusDiv) statusDiv.innerText = '';
          } else {
            // 2. Fallback: Load from local public folder if GitHub 401/404s
            console.warn('GitHub API failed, loading local config fallback...');
            const localRes = await fetch('/ThreeReasons/config_ThreeReasons_Hub.json');
            if (!localRes.ok) throw new Error('Local config file not found');
            currentConfig = await localRes.json();
            if (statusDiv) statusDiv.innerText = '⚠️ Connected via local fallback (GitHub auth needed for saving)';
            statusDiv.style.color = 'orange';
          }

          renderFormFields(currentConfig);
        } catch (err) {
          console.error('Config Load Error:', err);
          if (statusDiv) statusDiv.innerText = '❌ Failed to load configuration entirely.';
        }
      }

      function renderFormFields(config) {
        const container = document.getElementById('notesContainer');
        if (!container) return;
        container.innerHTML = '';
        const notes = config?.MenuSettings?.GeneralNotes || [];

        notes.forEach((note, index) => {
          const div = document.createElement('div');
          div.className = 'note-row';
          div.innerHTML = `
            <input type="text" class="note-input" value="${note}" placeholder="Notice line ${index + 1}" />
          `;
          container.appendChild(div);
        });
      }

      const adminForm = document.getElementById('adminForm');
      if (adminForm) {
        adminForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const statusDiv = document.getElementById('status');
          if (statusDiv) statusDiv.innerText = '⏳ Publishing updates...';

          const inputElements = document.querySelectorAll('.note-input');
          const updatedNotes = Array.from(inputElements)
            .map((input) => input.value.trim())
            .filter(Boolean);

          if (currentConfig && currentConfig.MenuSettings) {
            currentConfig.MenuSettings.GeneralNotes = updatedNotes;
          }

          const jsonString = JSON.stringify(currentConfig, null, 2);
          const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

          try {
            const putRes = await fetch(API_URL, {
              method: 'PUT',
              headers: {
                Authorization: `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: 'Client update via Admin Panel',
                content: encodedContent,
                sha: fileSha
              })
            });

            if (putRes.ok) {
              const responseData = await putRes.json();
              fileSha = responseData.content.sha;
              if (statusDiv) {
                statusDiv.innerText = '✅ Menu updated live!';
                statusDiv.style.color = 'green';
              }
            } else {
              throw new Error('API returned error');
            }
          } catch (err) {
            if (statusDiv) {
              statusDiv.innerText = '❌ Save failed. Check token or repository path.';
              statusDiv.style.color = 'red';
            }
          }
        });
      }

      loadCurrentConfig();

      const ACCESS_CODE = 'Sorrywedontdowifi'; // Simple local pin

        const userCode = prompt('Enter Admin PIN:');
        if (userCode !== ACCESS_CODE) {
        alert('Unauthorized access.');
        window.location.href = '/';
        } else {
        loadCurrentConfig();
        }
    </script></body></html>
