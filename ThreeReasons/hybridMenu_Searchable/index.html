<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title id="pageTitle">Loading Menu... | Business Name</title><link rel="stylesheet" href="/_astro/hybridMenu_Searchable.DUH5pv1K.css"></head><body><div class="menu-container"><div class="top-nav"><a href="/hub3Reasons/" class="back-btn">← Customer Hub</a></div><div class="header-banner"><h1 id="bannerTitle">Loading...</h1><p id="bannerSubtitle">Please wait while the menu loads.</p></div><!-- Generic Notes Section --><div class="generic-notes-container" id="genericNotesContainer"></div><!-- Search & Quick Filter Bar --><div class="search-section"><div class="search-wrapper"><input type="text" id="searchInput" placeholder="Search menu..." class="search-input"><button type="button" id="clearSearchBtn" class="clear-search-btn" aria-label="Clear search">✕</button></div><div class="dietary-toggles"><button type="button" class="badge-filter-btn" data-badge="GF">GF Only</button><button type="button" class="badge-filter-btn" data-badge="V">V Only</button></div></div><!-- Category Slider Pills --><nav class="category-hero-slider" id="categorySlider"><button class="category-pill active" data-category="All">All</button><button class="category-pill fav-pill" data-category="Favourites">Favourites ❤️ <span id="favCount">0</span></button></nav><!-- Category Blocks Container --><div id="menuContentArea"><div style="text-align: center; padding: 40px; color: #666;">Loading menu items...</div></div><!-- Dynamic Empty State --><div id="emptyState" class="empty-state" style="display: none;"><span id="emptyIcon" class="empty-icon">🔍</span><h3 id="emptyTitle">No items found</h3><p id="emptyStateText">No dishes match your current filter criteria.</p></div></div><!-- Image Modal Dialog --><dialog id="dishModal" class="dish-modal"><div class="modal-container"><button type="button" id="closeModal" class="close-btn">&times;</button><img id="modalImage" class="modal-img" src="" alt="Dish Preview"><div id="modalCaption" class="modal-caption"></div></div></dialog><!-- Runtime Client-Side Hydration Script --><script>
    let siteConfig = {};
    let activeCategory = 'All';
    let activeGF = false;
    let activeV = false;
    let favourites = JSON.parse(localStorage.getItem('menu_favourites') || '[]');

    

    async function initLiveMenu() {
      try {
        // Fetch config live with a timestamp query param to prevent browser caching old JSON
        const res = await fetch(`/ThreeReasons/config_ThreeReasons_Hub.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('Failed to load configuration JSON');
        siteConfig = await res.json();

        renderMenuApp(siteConfig);
      } catch (err) {
        console.error(err);
        document.getElementById('menuContentArea').innerHTML = `
          <div class="empty-state">
            <h3>⚠️ Error Loading Menu</h3>
            <p>Could not fetch configuration file.</p>
          </div>
        `;
      }
    }

    function renderMenuApp(config) {
      const menuSettings = config.MenuSettings || {};
      const generalNotes = menuSettings.GeneralNotes || [];
      const menuItems = config.MenuItems || [];
      const categoryConfigs = config.Categories || [];
      const showPhotos = menuSettings.showMenuPhotos !== false;

      // Set Header Titles
      document.getElementById('pageTitle').textContent = (menuSettings.title || 'Menu') + ' | Business Name';
      document.getElementById('bannerTitle').textContent = menuSettings.title || 'Our Menu';
      document.getElementById('bannerSubtitle').textContent = menuSettings.subtitle || '';

      // Render General Notes
      const notesContainer = document.getElementById('genericNotesContainer');
      if (generalNotes.length > 0) {
        notesContainer.innerHTML = generalNotes.map((note, index) => {
          if (sessionStorage.getItem(`general_note_dismissed_${index}`) === 'true') return '';
          return `
            <div class="generic-note-pill" data-note-index="${index}">
              <span class="note-icon">ℹ️</span>
              <span class="note-text">${note}</span>
              <button type="button" class="dismiss-note-btn" aria-label="Dismiss notice">✕</button>
            </div>
          `;
        }).join('');

        notesContainer.querySelectorAll('.dismiss-note-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const pill = e.target.closest('.generic-note-pill');
            const index = pill.getAttribute('data-note-index');
            pill.style.display = 'none';
            sessionStorage.setItem(`general_note_dismissed_${index}`, 'true');
          });
        });
      }

      // Extract Categories
      const extractedCategoryNames = [...new Set(menuItems.map(item => item.category))];
      const categories = categoryConfigs.length > 0 ? categoryConfigs : extractedCategoryNames.map(name => ({ name, subtitle: "", footnote: "" }));

      // Render Category Slider Pills
      const slider = document.getElementById('categorySlider');
      const pillHTML = categories.map(catConfig => {
        const catName = typeof catConfig === 'string' ? catConfig : catConfig.name;
        return `<button class="category-pill" data-category="${catName}">${catName}</button>`;
      }).join('');
      slider.innerHTML = `
        <button class="category-pill active" data-category="All">All</button>
        <button class="category-pill fav-pill" data-category="Favourites">
          Favourites ❤️ <span id="favCount">${favourites.length}</span>
        </button>
        ${pillHTML}
      `;

      // Render Menu Content Area
      const contentArea = document.getElementById('menuContentArea');
      contentArea.innerHTML = categories.map(catConfig => {
        const categoryName = typeof catConfig === 'string' ? catConfig : catConfig.name;
        const subtitle = typeof catConfig === 'object' ? catConfig.subtitle : '';
        const footnote = typeof catConfig === 'object' ? catConfig.footnote : '';
        
        const catItems = menuItems.filter(item => item.category === categoryName);
        const hasDualPrices = catItems.some(item => item.smallPrice && item.largePrice);

        return `
          <div class="category-block" data-category-section="${categoryName}">
            <div class="category-header">
              <h2 class="category-title">${categoryName}</h2>
              <div class="wavy-divider"></div>
              ${subtitle ? `<p class="category-subtitle-text">${subtitle}</p>` : ''}
              ${hasDualPrices ? `<div class="category-price-subheader"><span>Small / Reg</span></div>` : ''}
            </div>

            <div class="item-list">
              ${catItems.map(item => {
                const hasValidPhoto = showPhotos && item.image && item.image.trim() !== "";
                const itemId = item.id || item.title.toLowerCase().replace(/\s+/g, '-');
                return `
                  <div 
                    class="menu-item ${hasValidPhoto ? 'has-photo' : ''}"
                    data-id="${itemId}"
                    data-category="${item.category}"
                    data-title="${item.title.toLowerCase()}"
                    data-description="${(item.description || '').toLowerCase()}"
                    data-gf="${item.isGF ? "true" : "false"}"
                    data-v="${item.isV ? "true" : "false"}"
                    data-dish-name="${item.title}" 
                    data-dish-img="${item.image || ''}"
                  >
                    <div class="item-top-row">
                      <div class="item-title-group">
                        <span class="item-title">${item.title}</span>${item.isGF ? '<span class="badge gf" title="Gluten Free">GF</span>' : ''}
                        ${item.isV ? '<span class="badge v" title="Vegetarian">V</span>' : ''}
                      </div>

                      <span class="dots-leader"></span>

                      <div class="card-controls-row">
                        <div class="item-prices">
                          ${item.smallPrice && item.largePrice ? `<span>£${item.smallPrice}<span class="price-separator">/</span>£${item.largePrice}</span>` :
                            item.largePrice ? `<span>£${item.largePrice}</span>` :
                            item.smallPrice ? `<span>£${item.smallPrice}</span>` : ''}
                        </div>

                        <button type="button" class="heart-btn ${favourites.includes(itemId) ? 'active' : ''}" data-id="${itemId}" aria-label="Add to favourites">
                          <svg viewBox="0 0 24 24" class="heart-icon">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                          </svg>
                        </button>
                      </div>
                    </div>

                    ${item.description ? `<p class="item-desc">${item.description}</p>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
            ${footnote ? `<p class="category-footnote-text">${footnote}</p>` : ''}
          </div>
        `;
      }).join('');

      attachEventListeners(showPhotos);
      filterMenu();
    }

    function attachEventListeners(showPhotos) {
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const categoryBtns = document.querySelectorAll('.category-pill');
      const badgeBtns = document.querySelectorAll('.badge-filter-btn');

      if (searchInput && clearSearchBtn) {
        searchInput.addEventListener('input', () => {
          clearSearchBtn.style.display = searchInput.value.length > 0 ? 'flex' : 'none';
          filterMenu();
        });

        clearSearchBtn.addEventListener('click', () => {
          searchInput.value = '';
          clearSearchBtn.style.display = 'none';
          filterMenu();
          searchInput.focus();
        });
      }

      categoryBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          categoryBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategory = btn.getAttribute('data-category');
          filterMenu();
        });
      });

      badgeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const badgeType = btn.getAttribute('data-badge');
          if (badgeType === 'GF') {
            activeGF = !activeGF;
            btn.classList.toggle('active', activeGF);
          } else if (badgeType === 'V') {
            activeV = !activeV;
            btn.classList.toggle('active', activeV);
          }
          filterMenu();
        });
      });

      document.querySelectorAll('.heart-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-id');
          if (favourites.includes(id)) {
            favourites = favourites.filter(favId => favId !== id);
          } else {
            favourites.push(id);
          }
          updateFavouritesUI();
          filterMenu();
        });
      });

      if (showPhotos) {
        document.querySelectorAll('.menu-item.has-photo').forEach(item => {
          item.addEventListener('click', (e) => {
            if (e.target.closest('.heart-btn')) return;
            const name = item.getAttribute('data-dish-name');
            const imgSrc = item.getAttribute('data-dish-img');
            const modal = document.getElementById('dishModal');
            const modalImg = document.getElementById('modalImage');
            const modalCaption = document.getElementById('modalCaption');

            if (imgSrc && imgSrc.trim() !== "" && modal && modalImg) {
              modalImg.src = imgSrc;
              modalCaption.textContent = name;
              modal.showModal();
            }
          });
        });
      }

      const modal = document.getElementById('dishModal');
      const closeBtn = document.getElementById('closeModal');
      if (closeBtn && modal) {
        closeBtn.addEventListener('click', () => modal.close());
        modal.addEventListener('click', (e) => {
          const rect = modal.getBoundingClientRect();
          if (!(rect.top <= e.clientY && e.clientY <= rect.top + rect.height && rect.left <= e.clientX && e.clientX <= rect.left + rect.width)) {
            modal.close();
          }
        });
      }
    }

    function updateFavouritesUI() {
      localStorage.setItem('menu_favourites', JSON.stringify(favourites));
      const favCountSpan = document.getElementById('favCount');
      if (favCountSpan) favCountSpan.textContent = favourites.length;

      document.querySelectorAll('.menu-item').forEach(item => {
        const id = item.getAttribute('data-id');
        const heartBtn = item.querySelector('.heart-btn');
        if (heartBtn) {
          heartBtn.classList.toggle('active', favourites.includes(id));
        }
      });
    }

    function filterMenu() {
      const searchInput = document.getElementById('searchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      let totalVisible = 0;

      document.querySelectorAll('.category-block').forEach(section => {
        const catName = section.getAttribute('data-category-section');
        const itemsInCategory = section.querySelectorAll('.menu-item');
        let sectionVisibleCount = 0;

        itemsInCategory.forEach(item => {
          const id = item.getAttribute('data-id');
          const title = item.getAttribute('data-title') || '';
          const desc = item.getAttribute('data-description') || '';
          const isGF = item.getAttribute('data-gf') === 'true';
          const isV = item.getAttribute('data-v') === 'true';
          const isFav = favourites.includes(id);

          let matchesCategory = activeCategory === 'All' ? true : activeCategory === 'Favourites' ? isFav : catName === activeCategory;
          let matchesSearch = !query || title.includes(query) || desc.includes(query);
          let matchesGF = !activeGF || isGF;
          let matchesV = !activeV || isV;

          if (matchesCategory && matchesSearch && matchesGF && matchesV) {
            item.style.display = 'block';
            sectionVisibleCount++;
            totalVisible++;
          } else {
            item.style.display = 'none';
          }
        });

        section.style.display = sectionVisibleCount === 0 ? 'none' : 'block';
      });

      const emptyState = document.getElementById('emptyState');
      if (emptyState) {
        if (totalVisible === 0) {
          emptyState.style.display = 'block';
          if (activeCategory === 'Favourites') {
            document.getElementById('emptyIcon').textContent = '❤️';
            document.getElementById('emptyTitle').textContent = 'No Favourites Saved';
            document.getElementById('emptyStateText').textContent = "You haven't saved any favourites yet! Tap the ❤️ on any dish to shortlist it here.";
          } else {
            document.getElementById('emptyIcon').textContent = '🔍';
            document.getElementById('emptyTitle').textContent = 'No Items Found';
            document.getElementById('emptyStateText').textContent = "No dishes match your current search or filter criteria.";
          }
        } else {
          emptyState.style.display = 'none';
        }
      }
    }

    // Run on page load
    initLiveMenu();
  </script></body></html>
